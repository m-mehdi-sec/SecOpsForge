
name: PowerShell CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Pester Tests
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pester 6
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Ensure PowerShell Gallery is registered
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
              Register-PSRepository -Default
          }

          # Configure PowerShell Gallery
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted

          # Install required Pester version
          Install-Module Pester `
            -RequiredVersion 6.2.0 `
            -Repository PSGallery `
            -Scope CurrentUser `
            -Force `
            -AllowClobber `
            -ErrorAction Stop

          # Verify installation
          Get-Module Pester -ListAvailable |
            Where-Object Version -EQ '6.2.0'

      - name: Run Pester tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Import-Module Pester -RequiredVersion 6.2.0 -Force

          $result = Invoke-Pester -Path ./tests -Output Detailed -PassThru

          if ($result.FailedCount -gt 0 -or $result.TotalCount -eq 0) {
              exit 1
          }
