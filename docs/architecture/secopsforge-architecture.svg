
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="960" viewBox="0 0 1200 960">

  <defs>
    <style>
      text {
        font-family: "Segoe UI", Arial, sans-serif;
        fill: #24344d;
      }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #63758d; }
      .section { font-size: 16px; font-weight: 700; letter-spacing: 1px; }
      .name { font-size: 18px; font-weight: 650; }
      .detail { font-size: 13px; fill: #65758a; }
      .edge { fill: none; stroke: #8ca2ba; stroke-width: 2.5; }
      .dashed { stroke-dasharray: 7 6; }
    </style>

    <marker id="arrow" markerWidth="9" markerHeight="9"
            refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#8ca2ba"/>
    </marker>
  </defs>

  <rect width="1200" height="960" fill="#f7f9fc"/>

  <text x="600" y="57" text-anchor="middle" class="title">
    SecOpsForge
  </text>
  <text x="600" y="86" text-anchor="middle" class="subtitle">
    Microsoft Security Operations Lab | System Architecture
  </text>

  <!-- Hyper-V Lab -->
  <rect x="65" y="122" width="1070" height="180" rx="20"
        fill="#edf5ff" stroke="#c8def8" stroke-width="2"/>
  <text x="90" y="152" class="section" fill="#2563a6">
    HYPER-V LAB
  </text>

  <rect x="145" y="176" width="405" height="92" rx="14"
        fill="#ffffff" stroke="#c9dff5"/>
  <image href="data:image/svg+xml;base64," x="165" y="191"
         width="60" height="60"/>
  <text x="245" y="214" class="name">Windows 11 Client</text>
  <text x="245" y="237" class="detail">
    Entra joined | Intune managed | Defender
  </text>

  <rect x="650" y="176" width="405" height="92" rx="14"
        fill="#ffffff" stroke="#c9dff5"/>
  <image href="data:image/svg+xml;base64," x="670" y="191"
         width="60" height="60"/>
  <text x="750" y="214" class="name">Ubuntu Server 24.04</text>
  <text x="750" y="237" class="detail">
    Defender onboarded | Real-time protection
  </text>

  <!-- Connections -->
  <path class="edge" marker-end="url(#arrow)"
        d="M347 268 V365"/>
  <path class="edge" marker-end="url(#arrow)"
        d="M852 268 V365"/>
  <text x="363" y="333" class="detail">Device integration</text>
  <text x="868" y="333" class="detail">Security management</text>

  <!-- Microsoft Security Services -->
  <rect x="65" y="365" width="1070" height="240" rx="20"
        fill="#f2efff" stroke="#dcd2fb" stroke-width="2"/>
  <text x="90" y="395" class="section" fill="#6544b4">
    MICROSOFT SECURITY SERVICES
  </text>

  <rect x="100" y="430" width="305" height="125" rx="14"
        fill="#ffffff" stroke="#ddd5f4"/>
  <image href="data:image/svg+xml;base64,"
         x="122" y="450" width="65" height="65"/>
  <text x="199" y="473" class="name">Microsoft Entra ID</text>
  <text x="199" y="495" class="detail">Identity and device objects</text>
  <text x="199" y="516" class="detail">Ubuntu security group</text>

  <rect x="447" y="430" width="305" height="125" rx="14"
        fill="#ffffff" stroke="#ddd5f4"/>
  <image href="data:image/svg+xml;base64,"
         x="469" y="450" width="65" height="65"/>
  <text x="546" y="473" class="name">Microsoft Intune</text>
  <text x="546" y="495" class="detail">Endpoint security policy</text>
  <text x="546" y="516" class="detail">Linux AV policy: Success</text>

  <rect x="794" y="430" width="305" height="125" rx="14"
        fill="#ffffff" stroke="#ddd5f4"/>
  <image href="data:image/svg+xml;base64,"
         x="816" y="450" width="65" height="65"/>
  <text x="893" y="473" class="name">Microsoft Defender</text>
  <text x="893" y="495" class="detail">Endpoint protection</text>
  <text x="893" y="516" class="detail">Detection and incidents</text>

  <!-- Read-only data collection -->
  <path class="edge" d="M252 555 V635 H600"/>
  <path class="edge" d="M600 555 V635"/>
  <path class="edge" d="M947 555 V635 H600"/>
  <path class="edge" marker-end="url(#arrow)"
        d="M600 635 V687"/>
  <text x="618" y="656" class="detail">
    Read-only API collection
  </text>

  <!-- SecOpsForge -->
  <rect x="65" y="687" width="1070" height="198" rx="20"
        fill="#eaf7f0" stroke="#c4e7d0" stroke-width="2"/>
  <text x="90" y="717" class="section" fill="#237b50">
    SECOPSFORGE | POWERSHELL
  </text>

  <rect x="105" y="746" width="305" height="104" rx="14"
        fill="#ffffff" stroke="#c8e8d4"/>
  <image href="data:image/svg+xml;base64,"
         x="122" y="766" width="57" height="57"/>
  <text x="190" y="780" class="name">Security Inventory</text>
  <text x="190" y="802" class="detail">Microsoft Graph / Defender API</text>
  <text x="190" y="824" class="detail">Read-only assessment</text>

  <rect x="448" y="746" width="305" height="104" rx="14"
        fill="#ffffff" stroke="#c8e8d4"/>
  <text x="471" y="780" class="name">Private JSON Reports</text>
  <text x="471" y="804" class="detail">Inventory and findings</text>
  <text x="471" y="826" class="detail">Stored outside Git repository</text>

  <rect x="791" y="746" width="305" height="104" rx="14"
        fill="#ffffff" stroke="#c8e8d4"/>
  <text x="814" y="780" class="name">Offline HTML Dashboard</text>
  <text x="814" y="804" class="detail">Security posture overview</text>
  <text x="814" y="826" class="detail">Local report visualization</text>

  <path class="edge" marker-end="url(#arrow)"
        d="M410 798 H442"/>
  <path class="edge" marker-end="url(#arrow)"
        d="M753 798 H785"/>

  <text x="600" y="922" text-anchor="middle" class="detail">
    Architecture overview | SecOpsForge v1.0.0
  </text>
</svg>
